<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Spark StaySphere — the direct-booking experience, built for independent hotels. A white-label booking front end that lets guests discover rooms, add services and complete the whole journey directly." />
    <meta name="theme-color" content="#f3f1ec" />

    <!-- Social previews (Slack/Telegram/LinkedIn/X). No production domain is
         configured here, so og:image is root-relative — most crawlers resolve
         it against the URL they actually fetched; swap in an absolute URL
         once this is deployed somewhere with a fixed hostname. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Spark StaySphere" />
    <meta property="og:title" content="Spark StaySphere — The direct-booking experience for independent hotels" />
    <meta property="og:description" content="A white-label booking front end that lets guests discover rooms, add services and complete the whole journey directly." />
    <meta property="og:image" content="/photos/hotel-cove.webp" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Spark StaySphere — The direct-booking experience for independent hotels" />
    <meta name="twitter:description" content="A white-label booking front end that lets guests discover rooms, add services and complete the whole journey directly." />
    <meta name="twitter:image" content="/photos/hotel-cove.webp" />

    <link rel="icon" type="image/svg+xml" href="/brand/spark-logo.svg" />
    <link rel="preload" href="/fonts/inter.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/jost.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/ui/d-hero-scene.webp" as="image" type="image/webp" />
    <title>Spark StaySphere — The direct-booking experience for independent hotels</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
